services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    command: >
      postgres -c listen_addresses='*'
      -c log_connections=on
      -c log_disconnections=on
      -c log_duration=off
      -c log_line_prefix='%m [%u@%d pid=%p] '
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4:latest
    container_name: 69-s2-admin
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    environment:
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
    volumes:
      - ./data-pgadmin:/var/lib/pgadmin

  mailhog:
    image: mailhog/mailhog:latest
    container_name: 69-s2-mailhog
    ports:
      - "${MAIL_PORT1}:8025"
      - "${MAIL_PORT2}:1025"

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - ${APP_PORT}:1337
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - JWT_SECRET=${JWT_SECRET}
      - USER_JWT_EXPIRES_IN=${USER_JWT_EXPIRES_IN}
      - ADMIN_JWT_EXPIRES_IN=${ADMIN_JWT_EXPIRES_IN}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS}
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS}
      - AUDIT_ALERT_EMAIL=${AUDIT_ALERT_EMAIL}
      - AUDIT_ALERT_THRESHOLD=${AUDIT_ALERT_THRESHOLD}
      - AUDIT_ALERT_WINDOW_MS=${AUDIT_ALERT_WINDOW_MS}
      - AUDIT_ALERT_COOLDOWN_MS=${AUDIT_ALERT_COOLDOWN_MS}
      - BREACH_CHECK_FAIL_CLOSED=${BREACH_CHECK_FAIL_CLOSED}
      - MFA_ISSUER=${MFA_ISSUER}
      - MFA_BACKUP_CODE_COUNT=${MFA_BACKUP_CODE_COUNT}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - PUBLIC_URL=${PUBLIC_URL}

    volumes:
      - ./data-app:/srv/app

  tls:
    build: ./data-nginx
    container_name: 69-s2-tls
    ports:
      - "${HTTPS_PORT_APP}:443"
      - "${HTTPS_PORT_PGADMIN}:8443"
    depends_on:
      - app
      - admin
    restart: unless-stopped